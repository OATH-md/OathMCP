claims:
  - id: claim:map:calculator-model
    kind: applicability
    statement: Mean Arterial Pressure (MAP) uses the declared population and formula variant. The 1/3–2/3 estimate assumes a
      normal heart rate and waveform; it is less accurate at extremes of heart rate or with significant arrhythmia,
      where a measured (invasive) MAP is preferred.
    covers:
      - calculator:model
    status: supported
    sourceIds:
      - map_razminia_2004
    locators:
      - sourceId: map_razminia_2004
        locator: "Razminia 2004 abstract and methods: standard one-third formula is an approximation whose accuracy changes with
          heart rate."
    executable: false
    scenarioIds: []
    nonExecutableRationale: Model identity is descriptive; its executable equation, inputs, outputs, and applicability are scenario-tested.
    reviewedAt: 2026-07-16
    reviewBy: 2027-07-16
  - id: claim:map:formula-implementation
    kind: formula
    statement: MAP = diastolic pressure + one third of the pulse pressure.
    covers:
      - formula:implementation
    status: supported
    sourceIds:
      - map_aha_measurement_2024
    locators:
      - sourceId: map_aha_measurement_2024
        locator: "AHA blood-pressure measurement statement, PMCID PMC11409525, calculated MAP at normal heart rate: one-third
          SBP plus two-thirds DBP."
    executable: true
    scenarioIds:
      - case:map:ref-usual
      - case:map:ref-low
      - case:map:ref-high
    reviewedAt: 2026-07-16
    reviewBy: 2027-07-16
  - id: claim:map:applicability-purpose
    kind: applicability
    statement: Approximate MAP from systolic and diastolic blood pressure using DBP plus one third of pulse pressure at a
      normal heart rate.
    covers:
