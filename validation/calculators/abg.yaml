  - Removed zero sentinels for unavailable delta ratios and suppressed arterial PCO2 compensation branches for
    peripheral venous samples.
  - Preserved the deprecated venous_sample/is_venous surface while adding explicit sample_type and conflict rejection.
  - Made direct mixed branches explicit and labels respiratory or indeterminate compensation as not evaluated rather
    than physiologically inapplicable.
