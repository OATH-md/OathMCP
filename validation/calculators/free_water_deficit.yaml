  - id: claim:free_water_deficit:formula-implementation
    kind: formula
    statement: Free-water deficit = TBW fraction × weight × (current sodium/target sodium - 1), using adult male
      0.6, adult female 0.5, elderly male 0.5, or elderly female 0.45.
    covers:
