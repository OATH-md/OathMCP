calculatorId: pews
specVersion: 1.0.0
clinicalModel: Original three-domain Brighton Monaghan Pediatric Early Warning Score with two optional modifiers
variant: monaghan_2005_brighton_three_domain_plus_two_modifiers
population: Hospitalized children assessed against local age-specific norms using behavior, cardiovascular, and
  respiratory domains.
setting: Legacy Brighton pediatric inpatient deterioration surveillance; not the 2023 NHS England National PEWS or an
  emergency-department triage tool.
assessmentTiming: Serial bedside observation according to the institution-specific pediatric deterioration protocol.
endpoint: Integer screening score 0-13 without a universal response threshold; high and rising scores require
  interpretation under the local validated escalation policy.
reviewGroup: additive_criteria_scores
enrollment: pending_independent_review
