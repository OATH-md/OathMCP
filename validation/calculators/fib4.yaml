    citationChasing:
      backward: true
      forward: true
    checks:
      corrections: true
      retractions: true
      supersession: true
    qualityReview:
      method: PRESS-derived
      initialMedlineSourceId: search:fib4:pubmed-targeted
      checklist:
        - Population and model concept coverage
        - FIB-4 spelling, hyphenation, and index variants
        - Controlled vocabulary and text-word balance
        - Boolean grouping, fields, truncation, and PubMed translation
        - Derivation, validation, age, thresholds, and evidence synthesis
        - Guidance, correction, retraction, supersession, and citation chasing
      comments:
        - The original named-author query was rejected because it omitted the MASLD population block and missed Shah
          2009 and current guidance.
        - The unfiltered FIB-4 term block AND MASLD disease block returned 2271 records and was documented as a broad
          retrieval check, not screened or counted in the PRISMA accounting.
        - The final targeted, non-exhaustive 94-record query independently retrieved the four MASLD sentinels PMID
          19523535, 20801772, 27725647, and 34001645 before any PMID backstop.
        - PMID 16729309 was reviewed as a separate direct derivation seed; a discarded forced-PMID query was not used in
          the dossier.
        - The 12-record integrity query found no correction, retraction, or expression of concern affecting a retained
          source or the selected AGA 2026 pathway.
        - AGA 2026 is the selected US controlling authority. AASLD 2023 and EASL 2024 retain a separate 2.67 pathway and
          are recorded as divergent specialty guidance, not cross-guideline consensus.
      resolution: The exact targeted query, translation, result set, independent sentinel recall, separate provenance seed,
        complete screening ledger, direct society-source checks, and integrity search were reviewed and accepted with no
        remaining search-method blockers.
      resolved: true
      reviewer: Independent PRESS review lane
      reviewedAt: 2026-07-23
