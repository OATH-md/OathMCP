claims:
  - id: claim:fib4:calculator-model
    scope: clinical
    kind: applicability
    statement: This calculator implements the published Sterling 2006 FIB-4 equation and the explicitly selected 2026 AGA
      adult MASLD binary first-line screening pathway; it does not implement the original HIV/HCV cutoffs or the
      separate 2.67 pathway retained by AASLD and EASL.
    covers:
      - calculator:model
    status: supported
    sourceIds:
      - fib4_sterling_2006
      - fib4_aga_2026
      - fib4_aasld_2023
      - fib4_easl_2024
    locators:
      - sourceId: fib4_sterling_2006
        locator: Sterling 2006 abstract and full-text equation; original HIV/HCV derivation population and formula inputs.
      - sourceId: fib4_aga_2026
        locator: AGA 2026 pathway recommendations, steps 1-4; selected adult MASLD population and binary first-tier thresholds.
      - sourceId: fib4_aasld_2023
        locator: AASLD 2023 Figure 2; separate pathway retaining the 2.67 referral threshold.
