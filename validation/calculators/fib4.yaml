  - id: claim:fib4:formula-implementation
    scope: clinical
    kind: formula
    statement: FIB-4 equals age in years multiplied by AST in U/L, divided by platelet count in 10^9/L multiplied by the
      square root of ALT in U/L; screening uses the unrounded value and the reported score uses half-even rounding to
      two decimal places.
    covers:
      - formula:implementation
    status: supported
    sourceIds:
      - fib4_sterling_2006
      - fib4_who_2018
    locators:
