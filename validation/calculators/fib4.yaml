clinicalModel: Sterling 2006 FIB-4 equation with the 2026 AGA adult MASLD first-line screening pathway
variant: aga_2026_adult_masld_first_line
population: Adults at increased risk for MASLD in the 2026 AGA pathway; the screening interpretation is withheld below age 35.
setting: Stable ambulatory first-tier MASLD fibrosis-risk screening.
assessmentTiming: Contemporaneous age, AST, ALT, and platelet count obtained outside acute illness.
