cases:
  - id: case:ranson:reference-non-gallstone-equality
    kind: reference
    tags:
      - calculator:ranson:core
      - source-derived-reference
    inputs:
      etiology_variant: non_gallstone
      assessment_hours: 48
      admission_observed_at_hours: 0
      followup_observed_at_hours: 48
      age_years: 55
      wbc_admission: 16000
      glucose_admission: 200
      ast_admission: 250
      ldh_admission: 350
      hematocrit_admission: 45
      bun_admission: 15
      hematocrit_followup: 35
      bun_followup: 20
      calcium_followup: 8
      pao2_followup: 60
      base_deficit_followup: 4
      fluid_sequestration_followup: 6
    expected:
      admission_subtotal: 0
      admission_complete: true
      score: 0
      historical_mortality_band: ~1%
      assessment_complete: true
      missing_component_reasons: []
    expectedBehavior: calculate
    tolerance: &a1
