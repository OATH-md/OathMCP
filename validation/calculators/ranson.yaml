calculatorId: ranson
specVersion: 1.2.0
clinicalModel: Ranson historical acute-pancreatitis criteria derived from raw observations
variant: explicit_non_gallstone_or_gallstone_raw_observations
population: Adults with acute pancreatitis in the historical model populations,
  with an explicitly selected etiologic threshold set.
setting: Historical prognostic scoring alongside current acute-pancreatitis
  severity assessment and management guidance.
assessmentTiming: Admission observations at hour 0 and a completed assessment
  only at 48 hours; earlier follow-up criteria are not due.
endpoint: Historical completed score and cohort mortality band after all
  applicable 48-hour observations are available.
reviewGroup: additive_criteria_scores
enrollment: pending_independent_review
