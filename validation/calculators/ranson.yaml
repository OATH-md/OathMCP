claims:
  - id: d002.ranson_direct_inputs
    scope: compatibility
    kind: input
    statement: The direct Ranson tool must derive criteria from raw observations instead of trusting caller classification.
    covers:
      - compatibility:calculatorContracts:ranson.directTool.inputs
    status: supported
    sourceIds: []
    locators: []
    executable: false
    scenarioIds: []
    nonExecutableRationale: This is the reviewed public-surface decision; the separately linked clinical claim owns the sourced threshold, timing, and variant requirements.
    compatibilityDecision:
      oldBehavior: The direct tool accepted caller-classified criterion states plus phase and elapsed hours.
      replacement: The direct tool accepts raw timestamped observations for engine-owned threshold derivation.
      rationale: The direct Ranson tool must derive criteria from raw observations instead of trusting caller classification.
    reviewedAt: 2026-07-17
    reviewBy: 2027-07-16
