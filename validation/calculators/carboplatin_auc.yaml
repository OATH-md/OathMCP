compatibilityNotes:
  - Replaced the unconditional Cockcroft-Gault and 125 mL/min cap assumption with required kidney-function
    method, indexed/absolute status, treatment intent, and explicit ADDIKD or NCI/CTEP cap policy.
  - Added absolute and used kidney-function outputs, indexed-conversion status, cap status, and
    machine-readable cap-policy provenance.
  - Restricted the ADDIKD/eviQ eGFR method to CKD-EPI 2009 without race and made nearest-whole-mg final-dose
    rounding explicit in the input and result provenance.
  - Retained gfr_used as a deprecated additive result alias while requiring the new safety-critical method,
    indexing, policy, and rounding inputs.
