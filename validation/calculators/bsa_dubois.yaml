claims:
  - id: claim:bsa_dubois:calculator-model
    kind: applicability
    statement: Body Surface Area (DuBois) uses the declared population and formula variant. The 1916 formula was derived
      from a very small sample and may be inaccurate at body-size extremes. Apply any dosing cap only when the governing
      protocol explicitly requires it; this tool reports raw BSA.
    covers:
      - calculator:model
    status: supported
    sourceIds:
      - bsa_dubois_1916
    locators:
      - sourceId: bsa_dubois_1916
        locator: Du Bois and Du Bois 1916, derivation sample and named height-weight equation.
    executable: false
    scenarioIds: []
    nonExecutableRationale: Model identity is descriptive; its executable equation, inputs, outputs, and applicability are scenario-tested.
    reviewedAt: 2026-07-16
    reviewBy: 2027-07-16
  - id: claim:bsa_dubois:formula-implementation
    kind: formula
    statement: BSA = 0.007184 × height(cm)^0.725 × weight(kg)^0.425.
    covers:
      - formula:implementation
    status: supported
    sourceIds:
      - bsa_dubois_1916
    locators:
      - sourceId: bsa_dubois_1916
        locator: Du Bois and Du Bois 1916, Arch Intern Med 17:863-871, equation 0.007184 × H^0.725 × W^0.425.
    executable: true
    scenarioIds:
      - case:bsa_dubois:ref-1
      - case:bsa_dubois:ref-2
      - case:bsa_dubois:ref-3
    reviewedAt: 2026-07-16
    reviewBy: 2027-07-16
  - id: claim:bsa_dubois:applicability-purpose
    kind: applicability
    statement: Compute raw BSA (m²) with the Du Bois and Du Bois formula when a governing protocol explicitly names this
      variant. Do not infer a dose or cap.
    covers:
      - applicability:purpose
    status: supported
    sourceIds:
      - bsa_asco_2021
    locators:
      - sourceId: bsa_asco_2021
        locator: "ASCO 2021 guideline update, Recommendation 1.1 discussion: standard BSA formulas are protocol choices and do
          not imply a cap."
    executable: true
    scenarioIds:
