      - case:aa_gradient:ref-3
    reviewedAt: 2026-08-15
    reviewBy: 2027-08-15
  - id: claim:aa_gradient:applicability-purpose
    kind: applicability
    statement: Compute the alveolar-arterial oxygen gradient and the age-expected gradient to evaluate the
      mechanism of hypoxemia. A normal A-a gradient points to hypoventilation or low inspired oxygen; an
      elevated gradient points to V/Q mismatch, shunt, or diffusion limitation.
    covers:
      - applicability:purpose
    status: supported
    sourceIds:
      - aa_ers_2015
    locators:
      - sourceId: aa_ers_2015
        locator: ERS review, Level 2 alveolar gas equation and normal room-air A-a difference section; age/4 + 4 mmHg
          reference.
    executable: true
    scenarioIds:
