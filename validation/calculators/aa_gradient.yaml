    kind: formula
    statement: The calculator implements the source-bound simplified alveolar gas equation, NASA metric
      troposphere pressure curve fit, alveolar-arterial oxygen difference arithmetic, and declared final rounding.
    covers:
      - formula:implementation
    status: supported
    sourceIds:
