    reviewedAt: 2026-07-16
    reviewBy: 2027-07-16
  - id: claim:aa_gradient:applicability-exclusions
    kind: exclusion
    statement: The gradient becomes unreliable at high FiO2 and in the elderly, and is distorted by mechanical
      ventilation with PEEP; it is not disease-specific and must be read in clinical context.
