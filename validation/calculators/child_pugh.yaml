calculatorId: child_pugh
specVersion: 1.1.0
clinicalModel: Modified Child-Turcotte-Pugh cirrhosis score using INR thresholds
variant: modified_ctp_va_inr_1_7_2_3_adult_cirrhosis
population: Adults with established cirrhosis whose bilirubin, albumin, INR, ascites, and encephalopathy categories are available.
setting: Cirrhosis severity classification; not individualized survival, operative-risk, transplant-allocation, or
  treatment advice.
assessmentTiming: At a clinically coherent assessment time after grading ascites and encephalopathy under the same encounter context.
endpoint: Integer score 5-15 and descriptive class A (5-6), B (7-9), or C (10-15).
reviewGroup: additive_criteria_scores
enrollment: pending_independent_review
