cases:
  - kind: reference
    id: case:bsa:ref-1
    tags:
      - calculator:bsa:core
    inputs: &a2
      weight_kg: 70
      height_cm: 170
    expected:
      bsa: 1.82
    expectedBehavior: calculate
    tolerance: &a1
      mode: exact
      rationale: Frozen independently checked arithmetic after the calculator declared rounding rule.
    claimIds:
      - claim:bsa:formula-implementation
      - claim:bsa:input-weight_kg
      - claim:bsa:input-height_cm
      - claim:bsa:output-bsa
    sourceIds:
