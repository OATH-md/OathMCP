claims:
  - id: claim:bsa:calculator-model
    kind: applicability
    statement: Body Surface Area (Mosteller) uses the declared population and formula variant. BSA equations can diverge at
      body-size extremes. Use the exact formula and any cap named by the governing protocol; no single BSA formula is
      universally preferred.
    covers:
      - calculator:model
    status: supported
    sourceIds:
      - bsa_asco_2021
    locators:
      - sourceId: bsa_asco_2021
        locator: "ASCO 2021 guideline update, Recommendation 1.1 discussion: use a standard BSA formula; no evidence one formula
          is preferred."
    executable: false
    scenarioIds: []
    nonExecutableRationale: Model identity is descriptive; its executable equation, inputs, outputs, and applicability are scenario-tested.
    reviewedAt: 2026-07-16
    reviewBy: 2027-07-16
  - id: claim:bsa:formula-implementation
    kind: formula
    statement: BSA = square root of height(cm) multiplied by weight(kg), divided by 3600.
    covers:
      - formula:implementation
    status: supported
    sourceIds:
      - bsa_mosteller_1987
    locators:
      - sourceId: bsa_mosteller_1987
        locator: Mosteller 1987, NEJM 317:1098, square-root equation using height in cm, weight in kg, and denominator 3600.
    executable: true
    scenarioIds:
      - case:bsa:ref-1
      - case:bsa:ref-2
      - case:bsa:ref-3
    reviewedAt: 2026-07-16
    reviewBy: 2027-07-16
  - id: claim:bsa:applicability-purpose
    kind: applicability
    statement: Compute raw BSA (m²) with the Mosteller formula when the governing protocol names this variant. Do not infer
      a dose or cap.
    covers:
      - applicability:purpose
    status: supported
    sourceIds:
      - bsa_asco_2021
    locators:
      - sourceId: bsa_asco_2021
        locator: ASCO 2021 guideline update, Recommendation 1.1 and dose-limitation discussion; formula choice does not itself
          supply a cap.
    executable: true
    scenarioIds:
      - case:bsa:agent-purpose
    reviewedAt: 2026-07-16
    reviewBy: 2027-07-16
  - id: claim:bsa:applicability-exclusions
    kind: exclusion
    statement: Do not calculate without a protocol naming the Mosteller variant and both measured height and measured weight.
    covers:
      - applicability:exclusions
    status: supported
    sourceIds:
      - bsa_mosteller_1987
    locators:
      - sourceId: bsa_mosteller_1987
        locator: Mosteller 1987 equation requires both measured height and measured weight for the named formula.
    executable: true
    scenarioIds:
      - case:bsa:agent-exclusion
    reviewedAt: 2026-07-16
    reviewBy: 2027-07-16
  - id: claim:bsa:input-weight_kg
