  - id: claim:nihss:applicability:purpose
    kind: applicability
    statement: Quantify stroke severity from 15 focused neurological items (consciousness, gaze, visual fields, facial and
      limb motor function, ataxia, sensation, language, dysarthria, and extinction/inattention). Each item is scored on
      its own scale (0-2, 0-3, or 0-4); the total (0-42) grades impairment — the higher the score, the more severe the
      stroke.
    covers:
      - applicability:purpose
    status: supported
