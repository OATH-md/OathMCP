compatibilityNotes:
  - Replaced Booleans with four-state marker enums so unknown and not tested cannot collapse to negative.
  - Removed unsupported infectivity, disease-phase, treatment, and prognosis claims.
  - Preserved a known positive HBe marker even when its paired marker is unknown or not tested, while recording the
    missing paired state.
