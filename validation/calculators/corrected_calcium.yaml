      runtime-verifiable surface is separately scenario-tested.
    reviewedAt: 2026-07-16
    reviewBy: 2027-07-16
  - id: claim:corrected_calcium:formula-implementation
    kind: formula
    statement: "Legacy conventional BMJ 1977 arithmetic: adjusted calcium mg/dL = measured total calcium + 0.8 × (4 - albumin
      g/dL)."
    covers:
      - formula:implementation
    status: supported
    sourceIds:
      - calcium_bmj_1977
    locators:
      - sourceId: calcium_bmj_1977
        locator: BMJ 1977 page 598, conventional 0.02 mmol/L per g/L equation, equivalent to 0.8 mg/dL per g/dL.
