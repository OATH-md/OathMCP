  - id: claim:chemo_dose_bsa:applicability-purpose
    kind: applicability
    statement: "Compute an individual chemotherapy drug dose from a protocol-specified mg/m² dose and the
      patient's body surface area: calculated_dose = dose_per_m2 × BSA, then final_dose after any percentage
      reduction. BSA is not capped unless the caller explicitly enables the protocol-specific 2.0 m² cap."
    covers:
      - applicability:purpose
    status: supported
    sourceIds:
      - bsa_asco_2021
    locators:
      - sourceId: bsa_asco_2021
        locator: "ASCO 2021 Recommendations 1-2: full body-size-based cytotoxic dosing; no routine obesity cap."
    executable: true
    scenarioIds:
