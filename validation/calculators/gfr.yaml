    kind: applicability
    statement: 2021 CKD-EPI creatinine estimated GFR is limited to Adults aged 18 years or older with stable
      kidney function and standardized serum creatinine. Adult kidney-function assessment with albuminuria,
      chronicity, and confirmatory testing considered separately.
    covers:
      - calculator:model
    status: supported
    sourceIds:
