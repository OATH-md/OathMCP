        locator: KDIGO 2024 guideline, Figure 4 GFR categories and Practice Points 1.1.1.1-1.1.1.2, 1.2.2.1-1.2.2.2.
    executable: false
    scenarioIds: []
    nonExecutableRationale: Model identity and broad clinical limitations are descriptive; every
      runtime-verifiable surface is separately scenario-tested.
    reviewedAt: 2026-07-16
    reviewBy: 2027-07-16
  - id: claim:gfr:formula-implementation
    kind: formula
    statement: eGFR = 142 × min(SCr/k,1)^alpha × max(SCr/k,1)^-1.200 × 0.9938^age × 1.012 if female, with k
      0.7/0.9 and alpha -0.241/-0.302 for female/male.
    covers:
      - formula:implementation
    status: supported
    sourceIds:
      - gfr_inker_2021
    locators:
      - sourceId: gfr_inker_2021
        locator: Inker 2021 article and supplement, 2021 CKD-EPI eGFRcr equation and validation tables.
    executable: true
    scenarioIds:
