    kind: applicability
    statement: Body Mass Index (BMI) uses the declared population and formula variant. Do not apply these fixed adult
      categories to children. Interpret adult BMI with other health factors because it is a screening measure and
      surrogate marker rather than a direct body-fat measurement.
    covers:
      - calculator:model
    status: supported
    sourceIds:
      - bmi_cdc_2024
    locators:
      - sourceId: bmi_cdc_2024
        locator: CDC Adult BMI Categories, adults 20 years or older and "BMI is a screening measure" sections.
    executable: false
    scenarioIds: []
    nonExecutableRationale: Model identity is descriptive; its executable equation, inputs, outputs, and applicability are scenario-tested.
    reviewedAt: 2026-07-16
    reviewBy: 2027-07-16
