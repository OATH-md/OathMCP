calculatorId: qsofa
specVersion: 1.0.0
clinicalModel: Sepsis-3 quick Sequential Organ Failure Assessment bedside prognostic criteria
variant: sepsis3_2016_adult_suspected_infection_non_icu_with_ssc_2026_limit
population: Adults with suspected infection in prehospital, emergency-department, or general-ward settings.
setting: Rapid bedside poor-outcome risk prompt outside the ICU; not a standalone sepsis screen or diagnosis.
assessmentTiming: At initial assessment and repeated when clinical status changes.
endpoint: Integer score 0-3; two or more criteria identify adults with suspected infection at greater risk of death or
  prolonged ICU stay.
reviewGroup: additive_criteria_scores
enrollment: pending_independent_review
