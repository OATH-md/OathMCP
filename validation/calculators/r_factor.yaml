  - id: claim:r_factor:applicability-purpose
    kind: applicability
    statement: "Classify a pattern of liver injury from ALT and ALP using the R factor: R = (ALT/ALT_ULN) /
      (ALP/ALP_ULN). R ≥ 5 is hepatocellular, 2 < R < 5 is mixed, and R ≤ 2 is cholestatic. Returns the R
      value and injury type. Default upper limits of normal are ALT 40 U/L and ALP 115 U/L; override them with
      your lab's ULNs if they differ."
    covers:
      - applicability:purpose
    status: supported
    sourceIds:
      - r_aasld_2023
    locators:
      - sourceId: r_aasld_2023
        locator: "AASLD 2023 guidance, Initial laboratory assessment: R-value equation, timing, and competing causes."
    executable: true
    scenarioIds:
      - case:r_factor:agent-purpose
    reviewedAt: 2026-07-16
    reviewBy: 2027-07-16
  - id: claim:r_factor:applicability-exclusions
    kind: exclusion
    statement: Normal ULN values vary by lab — pass the correct alt_uln/alp_uln if yours differ. The R factor
      characterises a pattern; it does not identify the cause.
