claims:
  - id: claim:ich_volume:calculator-model
    kind: applicability
    statement: Intracerebral Hemorrhage Volume (ABC/2) uses the declared population and formula variant. Accuracy decreases
      for large, irregular, lobar, multilobar, or heterogeneous hemorrhages and when the simplified slice count does not
      reproduce Kothari's weighted C method. Prefer planimetry or validated segmentation when precision affects a
      decision.
    covers:
      - calculator:model
    status: supported
    sourceIds:
      - ich_aha_2022
      - ich_hanley_2015
    locators:
      - sourceId: ich_aha_2022
        locator: "2022 AHA/ASA spontaneous ICH guideline, section 2.2 and page e294: CT hematoma volume is often estimated with
          ABC/2."
      - sourceId: ich_hanley_2015
        locator: "Hanley 2015 systematic review, abstract and accuracy analyses: reduced ABC/2 accuracy for large, irregular,
          and lobar hemorrhages."
    executable: false
    scenarioIds: []
    nonExecutableRationale: Model identity is descriptive; its executable equation, inputs, outputs, and applicability are scenario-tested.
    reviewedAt: 2026-07-16
    reviewBy: 2027-07-16
  - id: claim:ich_volume:formula-implementation
    kind: formula
    statement: Volume = A × B × slice width × number of involved slices divided by 2; the compatibility shape flag does not
      select ABC/3.
    covers:
      - formula:implementation
    status: supported
    sourceIds:
      - ich_kothari_1996
    locators:
      - sourceId: ich_kothari_1996
        locator: "Kothari 1996, Methods: A is greatest diameter, B is perpendicular diameter, C is weighted slice extent, and
          volume is ABC/2."
    executable: true
    scenarioIds:
      - case:ich_volume:ref-small
      - case:ich_volume:ref-legacy-false
      - case:ich_volume:ref-decimal
      - case:ich_volume:legacy-alias
    reviewedAt: 2026-07-16
    reviewBy: 2027-07-16
  - id: claim:ich_volume:applicability-purpose
