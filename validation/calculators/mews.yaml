  setting-specific.
assessmentTiming: At admission and serially when the local track-and-trigger protocol requires reassessment.
endpoint: Integer score 0-14; the original cohort associated a score of 5 or more with increased risk of death, ICU
  admission, or high-dependency admission.
reviewGroup: additive_criteria_scores
enrollment: pending_independent_review
