claims:
  - id: claim:ibw:calculator-model
    kind: applicability
    statement: Ideal Body Weight (Devine) uses the declared population and formula variant. The Devine formula is anchored
      at 60 inches (152.4 cm) and is not accepted below that height. It is not a substitute for adjusted or lean body
      weight when a dosing protocol specifies another size descriptor.
    covers:
      - calculator:model
    status: supported
    sourceIds:
      - ibw_accp_2020
    locators:
      - sourceId: ibw_accp_2020
        locator: ACCP CCSAP 2020 Book 2 sample, body-size descriptor table and protocol-specific selection discussion.
    executable: false
    scenarioIds: []
    nonExecutableRationale: Model identity is descriptive; its executable equation, inputs, outputs, and applicability are scenario-tested.
    reviewedAt: 2026-07-16
    reviewBy: 2027-07-16
  - id: claim:ibw:formula-implementation
    kind: formula
    statement: Male IBW = 50 kg and female IBW = 45.5 kg, plus 2.3 kg per inch above 60 inches.
    covers:
      - formula:implementation
    status: supported
    sourceIds:
      - ibw_fda_ocs_2017
    locators:
      - sourceId: ibw_fda_ocs_2017
        locator: "FDA OCS Lung user guide, Appendix B: male 50 + 2.3 kg/in and female 45.5 + 2.3 kg/in above 5 feet."
    executable: true
    scenarioIds:
      - case:ibw:ref-male
      - case:ibw:ref-female
      - case:ibw:ref-anchor
    reviewedAt: 2026-07-16
    reviewBy: 2027-07-16
  - id: claim:ibw:applicability-purpose
    kind: applicability
    statement: Compute the adult Devine ideal-body-weight descriptor from height and formula sex only when a governing
      protocol requests it.
    covers:
