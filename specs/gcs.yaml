id: gcs
version: 1.1.0
name: Glasgow Coma Scale (GCS)
clinicalModel:
  modelKind: score
  modelId: gcs
  modelVersion: 1974_with_official_nt_reporting
  reviewDate: 2026-07-16
  evidenceRefs: [source_1, source_2]
applicability:
  population: Standardized assessment of eye, verbal, and motor responsiveness.
    Report each component; report a total only when all three are testable.
  setting: Acute neurological assessment with the assessment context and modifiers documented.
  exclusions:
    - Intubation, tracheostomy, sedation, paralysis, communication barriers, and
      local ocular injury can make a component Not Testable. Never substitute 1
      for an untestable component or report a misleading total.
  evidenceRefs: [source_1, source_2]
purposeForAgents: Record Glasgow Coma Scale components and a total only when all
  three components are testable; preserve Not Testable reasons and modifiers.
whenNotToUse: Do not manufacture a total when any component is Not Testable, and
  do not generalize traumatic-brain-injury severity labels to other contexts.
evidence:
  - id: source_1
    type: derivation
    citation: Teasdale G, Jennett B. Assessment of coma and impaired consciousness.
      A practical scale. Lancet. 1974;2(7872):81-84.
    locator: doi:10.1016/S0140-6736(74)91639-0
    doi: 10.1016/S0140-6736(74)91639-0
    url: https://doi.org/10.1016/S0140-6736(74)91639-0
    reviewed: true
  - id: source_2
    type: guideline
    citation: Glasgow Coma Scale. Official assessment aid and FAQ for factors
      interfering with assessment and Not Testable reporting.
    locator: url:https://www.glasgowcomascale.org/faq/
    url: https://www.glasgowcomascale.org/faq/
    reviewed: true
inputs:
  assessment_context:
    title: Assessment Context
    description: Context in which the component responses were assessed.
    kind: enum
    enumValues:
      - value: general_consciousness
        label: general consciousness assessment
        description: General standardized level-of-consciousness assessment.
      - value: acute_brain_injury
        label: acute brain injury
        description: Assessment in suspected or confirmed acute brain injury.
      - value: traumatic_brain_injury
        label: traumatic brain injury
        description: Assessment in traumatic brain injury.
    required: true
    conceptId: gcs.input.assessment_context
    examples: [general_consciousness]
    sourceRefs: [source_2]
  modifier_context:
    title: Examination Modifier
    description: Dominant factor affecting interpretation; choose a component's
      Not Testable option whenever that response cannot actually be tested.
    kind: enum
    enumValues:
      - value: none
        label: no modifier
        description: No material examination modifier documented.
      - value: intubation_or_tracheostomy
        label: intubation or tracheostomy
        description: Verbal assessment may be Not Testable.
      - value: sedation
        label: sedation
        description: Sedation may depress observed responses.
      - value: paralysis
        label: paralysis
        description: Motor assessment may be Not Testable.
      - value: language_or_communication_barrier
        label: language or communication barrier
        description: Verbal assessment may be Not Testable.
      - value: ocular_obstruction
        label: ocular obstruction
        description: Eye opening may be Not Testable.
      - value: other
        label: other modifier
        description: Another documented factor materially affects testing.
      - value: multiple_modifiers
        label: multiple modifiers
        description: More than one documented modifier affects different components; record each affected component Not Testable.
    required: true
    conceptId: gcs.input.modifier_context
    examples: [none]
    sourceRefs: [source_2]
  eye_opening:
    title: Eye Opening
    description: Best observed eye-opening response, or Not Testable when local factors prevent assessment.
    kind: enum
    enumValues:
      - { value: none, points: 1, label: none, description: No eye opening. }
      - { value: to_pain, points: 2, label: to pressure, description: Eye opening to pressure. }
      - { value: to_speech, points: 3, label: to sound, description: Eye opening to sound. }
      - { value: spontaneous, points: 4, label: spontaneous, description: Eyes open spontaneously. }
      - value: not_testable_ocular_obstruction
        scorable: false
        notTestableReason: Local ocular trauma, swelling, or obstruction prevents valid eye-opening assessment.
        label: not testable - ocular obstruction
        description: Eye opening cannot be tested because local factors obstruct assessment.
    required: true
    conceptId: gcs.input.eye_opening
    examples: [spontaneous]
    sourceRefs: [source_1, source_2]
    sharedKey: eye_opening
  verbal_response:
    title: Verbal Response
    description: Best observed verbal response, or Not Testable with an explicit reason.
    kind: enum
    enumValues:
      - { value: none, points: 1, label: none, description: No verbal response. }
      - { value: incomprehensible_sounds, points: 2, label: sounds, description: Incomprehensible sounds. }
      - { value: inappropriate_words, points: 3, label: words, description: Inappropriate words. }
      - { value: confused, points: 4, label: confused, description: Confused conversation. }
      - { value: oriented, points: 5, label: oriented, description: Oriented verbal response. }
      - value: not_testable_intubation
        scorable: false
        notTestableReason: Intubation or tracheostomy prevents valid verbal assessment.
        label: not testable - intubation or tracheostomy
        description: An artificial airway prevents verbal testing; do not substitute 1.
      - value: not_testable_communication_barrier
        scorable: false
        notTestableReason: A documented language or communication barrier prevents valid verbal assessment.
        label: not testable - communication barrier
        description: Communication cannot be assessed validly; do not substitute 1.
    required: true
    conceptId: gcs.input.verbal_response
    examples: [oriented]
    sourceRefs: [source_1, source_2]
    sharedKey: verbal_response
  motor_response:
    title: Motor Response
    description: Best observed motor response, or Not Testable when a physical limitation prevents assessment.
    kind: enum
    enumValues:
      - { value: none, points: 1, label: none, description: No motor response. }
      - { value: extension, points: 2, label: extension, description: Abnormal extension. }
      - { value: flexion, points: 3, label: abnormal flexion, description: Abnormal flexion. }
      - { value: flexion_withdrawal, points: 4, label: normal flexion, description: Normal flexion or withdrawal. }
      - { value: localizes_to_pain, points: 5, label: localizes, description: Localizes pressure. }
      - { value: obeys_commands, points: 6, label: obeys commands, description: Obeys commands. }
      - value: not_testable_paralysis
        scorable: false
        notTestableReason: Paralysis or another physical limitation prevents valid motor assessment.
        label: not testable - physical limitation
        description: Movement cannot be tested validly; do not substitute 1.
    required: true
    conceptId: gcs.input.motor_response
    examples: [obeys_commands]
    sourceRefs: [source_1, source_2]
    sharedKey: motor_response
constraints:
  - { kind: requireValueWhen, field: modifier_context, when: "==ocular_obstruction", target: eye_opening, value: not_testable_ocular_obstruction, message: Ocular obstruction requires the eye component to be recorded Not Testable. }
  - { kind: requireAtLeastValuesWhen, field: eye_opening, when: "==not_testable_ocular_obstruction", targets: [{ field: modifier_context, value: ocular_obstruction }, { field: modifier_context, value: multiple_modifiers }], message: The ocular-obstruction Not Testable option requires the matching or multiple-modifier context. }
  - { kind: requireValueWhen, field: modifier_context, when: "==intubation_or_tracheostomy", target: verbal_response, value: not_testable_intubation, message: Intubation or tracheostomy requires the verbal component to be recorded Not Testable. }
  - { kind: requireAtLeastValuesWhen, field: verbal_response, when: "==not_testable_intubation", targets: [{ field: modifier_context, value: intubation_or_tracheostomy }, { field: modifier_context, value: multiple_modifiers }], message: The intubation Not Testable option requires the matching or multiple-modifier context. }
  - { kind: requireValueWhen, field: modifier_context, when: "==language_or_communication_barrier", target: verbal_response, value: not_testable_communication_barrier, message: A communication barrier requires the verbal component to be recorded Not Testable. }
  - { kind: requireAtLeastValuesWhen, field: verbal_response, when: "==not_testable_communication_barrier", targets: [{ field: modifier_context, value: language_or_communication_barrier }, { field: modifier_context, value: multiple_modifiers }], message: The communication-barrier Not Testable option requires the matching or multiple-modifier context. }
  - { kind: requireValueWhen, field: modifier_context, when: "==paralysis", target: motor_response, value: not_testable_paralysis, message: Paralysis requires the motor component to be recorded Not Testable. }
  - { kind: requireAtLeastValuesWhen, field: motor_response, when: "==not_testable_paralysis", targets: [{ field: modifier_context, value: paralysis }, { field: modifier_context, value: multiple_modifiers }], message: The paralysis Not Testable option requires the matching or multiple-modifier context. }
  - kind: requireAtLeastValuesWhen
    field: modifier_context
    when: "==multiple_modifiers"
    minimum: 2
    targets:
      - { field: eye_opening, value: not_testable_ocular_obstruction }
      - { field: verbal_response, value: not_testable_intubation }
      - { field: verbal_response, value: not_testable_communication_barrier }
      - { field: motor_response, value: not_testable_paralysis }
    message: Multiple modifiers require at least two affected GCS components to be recorded Not Testable.
outputs:
  gcs_total:
    title: GCS Total Score
    description: Total score (3-15), returned only when all components are testable.
    kind: integer
    availability: { kind: computeCondition, conditionId: complete_total }
    evidenceRefs: [source_1, source_2]
  eye_score:
    title: Eye Opening Score
    description: Eye component score, omitted when eye opening is Not Testable.
    kind: integer
    availability: { kind: computeCondition, conditionId: eye_testable }
    evidenceRefs: [source_1, source_2]
  verbal_score:
    title: Verbal Response Score
    description: Verbal component score, omitted when verbal response is Not Testable.
    kind: integer
    availability: { kind: computeCondition, conditionId: verbal_testable }
    evidenceRefs: [source_1, source_2]
  motor_score:
    title: Motor Response Score
    description: Motor component score, omitted when motor response is Not Testable.
    kind: integer
    availability: { kind: computeCondition, conditionId: motor_testable }
    evidenceRefs: [source_1, source_2]
  assessment_complete:
    title: Assessment Complete
    description: True only when all components are testable and a total can be reported.
    kind: boolean
    availability: { kind: always }
    evidenceRefs: [source_2]
  missing_component_reasons:
    title: Not-Testable Component Reasons
    description: Reasons omitted components and the total could not be scored; empty when complete.
    kind: string_list
    availability: { kind: always }
    evidenceRefs: [source_2]
primaryOutputs: [gcs_total, assessment_complete]
scoring:
  output: gcs_total
  components:
    - { kind: enum, field: eye_opening }
    - { kind: enum, field: verbal_response }
    - { kind: enum, field: motor_response }
  range: [3, 15]
  evidenceRefs: [source_1, source_2]
