interpretationBands:
  - code: gad7_band_1
    kind: screening
    when: ">=15"
    label: Severe symptom range on this screening and severity-tracking instrument; clinical evaluation is required.
    severity: critical
    evidenceRefs:
      - source_1
  - code: gad7_band_2
    kind: screening
    when: ">=10"
    label: Moderate symptom range; score >=10 is a reasonable screening cut point, not a standalone diagnosis.
    severity: abnormal
    evidenceRefs:
      - source_1
  - code: gad7_band_3
    kind: screening
    when: ">=5"
    label: Mild symptom range on the GAD-7 screening instrument.
    severity: borderline
    evidenceRefs:
      - source_1
  - code: gad7_band_4
    kind: screening
    when: <5
    label: Minimal symptom range on the GAD-7 screening instrument.
    severity: normal
    evidenceRefs:
      - source_1
scoring:
  output: gad7_score
  components:
