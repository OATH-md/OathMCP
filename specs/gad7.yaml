id: gad7
version: 1.0.0
name: GAD-7 (Generalized Anxiety Disorder-7)
clinicalModel:
  modelKind: score
  modelId: gad7
  modelVersion: spitzer_2006_original_english_adult_primary_care
  reviewDate: 2026-07-16
  evidenceRefs:
    - source_1
    - source_2
    - source_3
    - source_4
applicability:
  population: Adults completing the original seven self-reported symptom-frequency items for the preceding two weeks.
  setting: Primary-care anxiety screening and symptom-severity follow-up; not a diagnostic interview or crisis assessment.
  exclusions:
    - A screening and symptom-severity instrument, not a diagnosis. A positive screen requires diagnostic assessment. It
      does not assess suicidality or replace urgent crisis and safety evaluation.
  evidenceRefs:
    - source_1
    - source_2
    - source_3
    - source_4
purposeForAgents: Adults completing the original seven self-reported symptom-frequency items for the preceding two
  weeks. Return an integer symptom score from 0-21 with minimal, mild, moderate, and severe ranges; score 10 is a screening cut
  point, not a diagnosis.
whenNotToUse: A screening and symptom-severity instrument, not a diagnosis. A positive screen requires diagnostic
  assessment. It does not assess suicidality or replace urgent crisis and safety evaluation.
evidence:
  - id: source_1
    type: derivation
    citation: "A brief measure for assessing generalized anxiety disorder: the GAD-7."
    locator: "Methods and Results: seven preceding-two-week items, response weights 0-3, total 0-21, severity cut points
      5/10/15, and criterion interview at score 10."
    url: https://pubmed.ncbi.nlm.nih.gov/16717171/
    reviewed: true
  - id: source_2
    type: validation
    citation: Validation and standardization of the Generalized Anxiety Disorder Screener (GAD-7) in the general population.
    locator: "Methods and Results: nationally representative adult sample, construct validity, reliability, and population
      norms."
    url: https://pubmed.ncbi.nlm.nih.gov/18388841/
    reviewed: true
  - id: source_3
    type: guideline
    citation: Generalized Anxiety Disorder 7 (GAD 7).
    locator: "Official form: seven symptom items and four response-frequency choices for the preceding two weeks."
    url: https://www.nih.gov/node/19876
    reviewed: true
  - id: source_4
    type: guideline
    citation: "Screening for Anxiety Disorders in Adults: US Preventive Services Task Force Recommendation Statement."
    locator: "Practice considerations: screening applies to adults without recognized symptoms and positive results require
      diagnostic assessment and follow-up."
    url: https://www.uspreventiveservicestaskforce.org/uspstf/recommendation/anxiety-adults-screening
    reviewed: true
inputs:
  feeling_nervous:
    title: Feeling nervous, anxious, or on edge
    description: How often have you been bothered by feeling nervous, anxious, or on edge over the last 2 weeks?
    kind: enum
    enumValues:
      - value: not_at_all
        points: 0
        label: not at all
        description: "Feeling nervous, anxious, or on edge: not at all."
      - value: several_days
        points: 1
        label: several days
        description: "Feeling nervous, anxious, or on edge: several days."
      - value: more_than_half_the_days
        points: 2
        label: more than half the days
        description: "Feeling nervous, anxious, or on edge: more than half the days."
      - value: nearly_every_day
        points: 3
        label: nearly every day
        description: "Feeling nervous, anxious, or on edge: nearly every day."
    required: true
    conceptId: gad7.input.feeling_nervous
