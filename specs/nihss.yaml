constraints:
  - { kind: requireValueWhen, field: modifier_context, when: "==intubation", target: dysarthria, value: intubated, message: Intubation requires dysarthria to be recorded UN rather than assigned a numeric score. }
  - { kind: requireAtLeastValuesWhen, field: dysarthria, when: "==intubated", targets: [{ field: modifier_context, value: intubation }, { field: modifier_context, value: multiple_modifiers }], message: The intubated dysarthria option requires the matching or multiple-modifier context. }
  - kind: requireAtLeastValuesWhen
    field: modifier_context
    when: "==amputation_or_joint_fusion"
    targets:
      - { field: left_arm_motor, value: amputation }
      - { field: right_arm_motor, value: amputation }
      - { field: left_leg_motor, value: amputation }
      - { field: right_leg_motor, value: amputation }
      - { field: limb_ataxia, value: amputation }
    message: Amputation or joint fusion context requires at least one affected NIHSS item to be recorded UN.
  - { kind: requireAtLeastValuesWhen, field: left_arm_motor, when: "==amputation", targets: [{ field: modifier_context, value: amputation_or_joint_fusion }, { field: modifier_context, value: multiple_modifiers }], message: An amputated left-arm item requires the matching or multiple-modifier context. }
  - { kind: requireAtLeastValuesWhen, field: right_arm_motor, when: "==amputation", targets: [{ field: modifier_context, value: amputation_or_joint_fusion }, { field: modifier_context, value: multiple_modifiers }], message: An amputated right-arm item requires the matching or multiple-modifier context. }
  - { kind: requireAtLeastValuesWhen, field: left_leg_motor, when: "==amputation", targets: [{ field: modifier_context, value: amputation_or_joint_fusion }, { field: modifier_context, value: multiple_modifiers }], message: An amputated left-leg item requires the matching or multiple-modifier context. }
  - { kind: requireAtLeastValuesWhen, field: right_leg_motor, when: "==amputation", targets: [{ field: modifier_context, value: amputation_or_joint_fusion }, { field: modifier_context, value: multiple_modifiers }], message: An amputated right-leg item requires the matching or multiple-modifier context. }
  - { kind: requireAtLeastValuesWhen, field: limb_ataxia, when: "==amputation", targets: [{ field: modifier_context, value: amputation_or_joint_fusion }, { field: modifier_context, value: multiple_modifiers }], message: An amputated ataxia item requires the matching or multiple-modifier context. }
  - kind: requireAtLeastValuesWhen
    field: modifier_context
    when: "==multiple_modifiers"
    minimum: 2
    targets:
      - { field: left_arm_motor, value: amputation }
      - { field: right_arm_motor, value: amputation }
      - { field: left_leg_motor, value: amputation }
      - { field: right_leg_motor, value: amputation }
      - { field: limb_ataxia, value: amputation }
      - { field: dysarthria, value: intubated }
    message: Multiple modifiers require at least two affected NIHSS items to be recorded UN.
outputs:
  nihss_score:
    title: NIHSS Score
    description: Total NIH Stroke Scale score (0-42), returned only when every
      item is testable. A score of 0 means no deficit detected by NIHSS; stroke
      is not excluded.
    kind: integer
    availability:
      kind: computeCondition
      conditionId: complete_total
    evidenceRefs:
      - source_1
      - source_2
      - source_3
  assessment_complete:
    title: Assessment Complete
    description: True only when every NIHSS item is testable and a total can be reported.
    kind: boolean
    availability: { kind: always }
    evidenceRefs: [source_2]
  missing_component_reasons:
    title: Untestable Item Reasons
    description: Reasons a total was omitted; empty when all items are testable.
    kind: string_list
    availability: { kind: always }
    evidenceRefs: [source_2]
primaryOutputs:
  - nihss_score
scoring:
  output: nihss_score
  components:
    - kind: enum
      field: level_of_consciousness
    - kind: enum
      field: month_and_age
    - kind: enum
      field: commands
    - kind: enum
      field: horizontal_gaze
    - kind: enum
      field: visual_fields
    - kind: enum
      field: facial_palsy
    - kind: enum
      field: left_arm_motor
    - kind: enum
      field: right_arm_motor
    - kind: enum
      field: left_leg_motor
    - kind: enum
      field: right_leg_motor
    - kind: enum
      field: limb_ataxia
    - kind: enum
      field: sensation
    - kind: enum
      field: language
    - kind: enum
      field: dysarthria
    - kind: enum
      field: extinction
  range:
    - 0
    - 42
  evidenceRefs:
    - source_1
