id: nihss
version: 1.1.0
name: NIH Stroke Scale (NIHSS)
synonyms:
  - stroke severity
  - neurologic stroke deficit
abbreviations:
  - NIHSS
clinicalModel:
  modelKind: score
  modelId: nihss
  modelVersion: 1.0.0
  reviewDate: 2026-07-16
  evidenceRefs:
    - source_1
    - source_2
applicability:
  population: Quantify stroke severity from 15 focused neurological items
    (consciousness, gaze, visual fields, facial and limb motor function, ataxia,
    sensation, language, dysarthria, and extinction/inattention). Each item is
    scored on its own scale (0-2, 0-3, or 0-4); the total (0-42) grades
    impairment — the higher the score, the more severe the stroke.
  setting: Clinical decision support; apply only in the context declared by this
    calculator.
  exclusions:
    - Full of caveats for patients with prior neurologic deficits (prior
      weakness, hemi-/quadriplegia, blindness), intubation, or a language
      barrier. In those cases consult the NIH Stroke Scale reference. Not a
      substitute for clinical judgment or imaging.
  evidenceRefs:
    - source_1
purposeForAgents: Quantify stroke severity from 15 focused neurological items
  (consciousness, gaze, visual fields, facial and limb motor function, ataxia,
  sensation, language, dysarthria, and extinction/inattention). Each item is
  scored on its own scale (0-2, 0-3, or 0-4); the total (0-42) grades impairment
  — the higher the score, the more severe the stroke.
whenNotToUse: Full of caveats for patients with prior neurologic deficits (prior
  weakness, hemi-/quadriplegia, blindness), intubation, or a language barrier.
  In those cases consult the NIH Stroke Scale reference. Not a substitute for
  clinical judgment or imaging.
evidence:
  - id: source_1
    type: derivation
    citation: "Brott T, Adams HP Jr, Olinger CP, et al. Measurements of acute
      cerebral infarction: a clinical examination scale. Stroke.
      1989;20(7):864-870."
    locator: doi:10.1161/01.STR.20.7.864
    doi: 10.1161/01.STR.20.7.864
    url: https://doi.org/10.1161/01.STR.20.7.864
    reviewed: true
  - id: source_2
    type: reference
    citation: National Institute of Neurological Disorders and Stroke. NIH Stroke
      Scale booklet and examination instructions.
    locator: updated February 2024 form and item instructions; reviewed 2026-07-16
    url: https://www.ninds.nih.gov/sites/default/files/documents/NIH-Stroke-Scale_updatedFeb2024_508.pdf
    reviewed: true
  - id: source_3
    type: validation
    citation: Martin-Schild S, Albright KC, Tanksley J, et al. Zero on the NIHSS
      does not equal the absence of stroke. Ann Emerg Med. 2011;57(1):42-45.
    locator: doi:10.1016/j.annemergmed.2010.06.564
    doi: 10.1016/j.annemergmed.2010.06.564
    url: https://pubmed.ncbi.nlm.nih.gov/20828876/
    reviewed: true
inputs:
  assessment_timing:
    title: Assessment Timing
    description: Clinical timing of this NIHSS assessment; preserve it when comparing serial scores.
    kind: enum
    enumValues:
      - { value: baseline, label: baseline, description: Baseline assessment before acute treatment. }
      - { value: post_treatment, label: post-treatment, description: Assessment after an acute treatment. }
      - { value: follow_up, label: follow-up, description: Later follow-up assessment. }
    required: true
    conceptId: nihss.input.assessment_timing
    examples: [baseline]
    sourceRefs: [source_2]
  modifier_context:
    title: Examination Modifier
    description: Dominant modifier affecting interpretation; use the specific UN
      option for an item that cannot be tested.
    kind: enum
    enumValues:
      - { value: none, label: no modifier, description: No material examination modifier documented. }
      - { value: intubation, label: intubation, description: Dysarthria may be untestable. }
      - { value: amputation_or_joint_fusion, label: amputation or joint fusion, description: A motor or ataxia item may be untestable. }
      - { value: language_barrier, label: language barrier, description: Communication context affects the examination. }
      - { value: pre_existing_deficit, label: pre-existing deficit, description: A prior neurological deficit affects interpretation. }
      - { value: other, label: other modifier, description: Another documented modifier affects testing. }
      - { value: multiple_modifiers, label: multiple modifiers, description: More than one modifier affects different items; record every affected item UN. }
    required: true
    conceptId: nihss.input.modifier_context
    examples: [none]
    sourceRefs: [source_2]
